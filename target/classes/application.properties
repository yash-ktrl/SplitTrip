spring.application.name=travel-book

spring.datasource.url=jdbc:mysql://localhost:3306/niet_travel?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Initialize database schema and data automatically
spring.sql.init.mode=always

# JSP Configuration
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Optional: logging for JDBC
logging.level.org.springframework.jdbc.core.JdbcTemplate=WARN
